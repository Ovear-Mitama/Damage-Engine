# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Increase parallel workers (multi-task execution & concurrent dependency downloads)
org.gradle.workers.max=8
# fabric-loom 1.11.8 requires Gradle to run on a Java 21+ JVM
org.gradle.java.home=C:/Program Files/Zulu/zulu-21
# Explicitly register JDKs so the Java toolchain (17) can be resolved
org.gradle.java.installations.paths=C:/Program Files/Zulu/zulu-17,C:/Program Files/Zulu/zulu-21

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# 1.19 尝试构建:工具链降到 1.19(仅构建配置,业务代码未改)
minecraft_version=1.19
loader_version=0.14.21
loom_version=1.11.8

# Mod Properties
mod_version=1.4.7.4
maven_group=damage.engine
archives_base_name=damage-engine

# ModMenu (compile only, optional at runtime)
# 1.19 用 4.x 线
modmenu_version=4.0.+

# TaCZ: Refabricated (compileOnly, optional at runtime) - from CurseForge
# project 1334246, file TACZ-Refabricated-1.20.1-0.7.0-forge1.1.8-hotfix.jar (synced with Forge-side TACZ 1.1.8-hotfix)
# 1.19 需要对应的 TaCZ 构建,先停用(否则 1.20.1 的包会污染编译错误清单)
# tacz_refabricated_file_id=8153691

# Fabric API (required for networking)
# 1.19 用 0.58.x 线
fabric_api_version=0.58.+
