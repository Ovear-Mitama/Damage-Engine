# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "26.1.x" ]
  pull_request:
    branches: [ "26.1.x" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Damage-Engine
      uses: actions/checkout@v4

    # build.gradle 以 ../texture-animation-library 引用同级的 Anima 库产物，
    # 因此先克隆 Anima 的 26.1.x 分支并构建，供下面的编译与 Jar-in-Jar 使用。
    - name: Checkout Anima library
      run: git clone --depth 1 --branch 26.1.x https://github.com/Ovear-Mitama/Anima.git ../texture-animation-library

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    # 两个仓库的 gradle.properties 里都写了本机 Windows 路径的 org.gradle.java.home，CI 上无效；
    # 命令行 -D 优先级高于 gradle.properties，这里统一用 runner 上已安装的 JDK 位置覆盖。
    - name: Build Anima library
      run: |
        chmod +x ../texture-animation-library/gradlew
        cd ../texture-animation-library
        ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

    - name: Build with Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Damage-Engine
      uses: actions/checkout@v4

    # 解析依赖需要 build.gradle 里声明的 Anima jar 存在，故同样先构建库。
    - name: Checkout Anima library
      run: git clone --depth 1 --branch 26.1.x https://github.com/Ovear-Mitama/Anima.git ../texture-animation-library

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Build Anima library
      run: |
        chmod +x ../texture-animation-library/gradlew
        cd ../texture-animation-library
        ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
        additional-arguments: -Dorg.gradle.java.home=${{ env.JAVA_HOME }}
      continue-on-error: true
