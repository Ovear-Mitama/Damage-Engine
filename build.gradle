plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// 产物命名:anima 同款规则 <名字>-<版本>-Fabric-<MC>.jar
// 本分支编译基线是 1.18.2,但产物声明支持 1.18/1.18.1/1.18.2,尾巴固定写 1.18 避免误导
tasks.named('remapJar') {
	archiveFileName = "${project.archives_base_name}-${project.mod_version}-Fabric-1.18.jar"
}

repositories {
    mavenLocal()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    maven { url "https://maven.aliyun.com/repository/public" }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/damage-engine.accesswidener")

    mods {
        "damage-engine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Include common shared sources
sourceSets {
    main {
        java {
            srcDir 'common/src/main/java'
            // Fabric 端没有 1.18.2 版的 TaCZ("TaCZ: Refabricated" 只有 1.20.1+),
            // 所以只排除这一个直接依赖 TaCZ Fabric 事件类的文件;反射版的 TaczCompat /
            // TaczServerHeadshotTracker 不需要 TaCZ 也能编译,照常参与编译。
            exclude 'damage/engine/compat/tacz/TaczFabricCompat.java'
        }
    }
    client {
        java {
            srcDir 'common/src/client/java'
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (required for networking)
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ModMenu (optional, for config screen integration)
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    // ModMenu 3.2.1 的 POM 把 fabric-loader 0.13.3 声明成 runtime 依赖(老版 JiJ 的发布方式),
    // 会和 gradle.properties 里的 loader_version 一起被 Loom 放进运行时类路径,
    // 启动时直接报 "duplicate fabric loader classes found on classpath"。排除掉这个嵌套 loader。
    modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }

    // TaCZ: Refabricated - 1.18.2 还没有对应的构建,先停用依赖并把兼容代码排除出编译。
    // 兼容代码本身与最新 1.20.1 分支保持一致,等有 1.18.2 版 TaCZ 时再打开即可。
    // modCompileOnly "curse.maven:tacz-refabricated-1334246:${project.tacz_refabricated_file_id}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

// MC 1.20.1 / LWJGL 3.3.1 must run on Java 17 (JDK 21 crashes runClient with "Unsupported JNI version")
tasks.named('runClient', JavaExec) {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
	
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(sourceSets.client.output)

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
