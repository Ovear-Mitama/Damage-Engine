# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# FG 5.1 首次要为 MC 1.19 做反编译,2G 容易 OOM,这里放宽到 4G
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true

# Use system JDK (Zulu 21)
org.gradle.java.home=C:/Program Files/Zulu/zulu-17

# Environment Properties
# 1.19 尝试构建:工具链降到 1.19(仅构建配置,业务代码未改)
minecraft_version=1.19
# The Minecraft version range can use any release version of Minecraft as bounds.
# 1.19.3 起 Mojang 把矩阵换成 JOML(org.joml),渲染相关代码不兼容,故本分支只覆盖到 1.19.2。
minecraft_version_range=[1.19,1.19.3)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=41.1.0
# The loader version range - also used as the required Forge (game loader)
# version in mods.toml.
loader_version_range=[41,)

# Mod Properties
mod_id=damageengine
mod_name=Damage Engine
mod_license=MIT
mod_version=1.4.7.4
mod_group_id=damage.engine

# TACZ (compileOnly, optional runtime dependency) - from Modrinth
# project timeless-and-classics-zero. 1.19.2 最后版本是 1.1.4-hotfix
# (1.20.1 分支用的是 1.1.8-hotfix,两边事件 API 相同)
tacz_version=1.1.4-hotfix
