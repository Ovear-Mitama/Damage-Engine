# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true

# Use system JDK (Zulu 21)
org.gradle.java.home=C:/Program Files/Zulu/zulu-17

# Environment Properties
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Forge build targets 1.20.1 only; restrict the declared range to exactly 1.20.1.
minecraft_version_range=[1.20.1]
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.3.0
# The loader version range - also used as the required Forge (game loader)
# version in mods.toml. Relaxed to 46 for releases; the dev environment still
# builds/runs against forge_version below.
loader_version_range=[46,)

# Mod Properties
mod_id=damageengine
mod_name=Damage Engine
mod_license=MIT
mod_version=1.4.4.2
mod_group_id=damage.engine

# TACZ (compileOnly, optional runtime dependency) - from CurseForge
# project 1028108, file tacz-1.20.1-1.1.8-hotfix.jar
tacz_file_id=8141310
