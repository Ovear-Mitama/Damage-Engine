# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# FG 5.1 首次要为 MC 1.19 做反编译,2G 容易 OOM,这里放宽到 4G
org.gradle.jvmargs=-Xmx4G -Duser.language=en -Duser.country=US
org.gradle.daemon=true
# FG 5.1 在并行模式下取冷缓存工件(如 net.minecraft:joined:srg)会抛
# "DefaultToolchainSpec / ProjectScopeServices has been closed",串行构建可避开
org.gradle.parallel=false
org.gradle.caching=true
# org.gradle.configuration-cache=true

# Use system JDK (Zulu 21)
org.gradle.java.home=C:/Program Files/Zulu/zulu-17

# Environment Properties
# 1.19.3 分支:仅声明 1.19.3(1.19.4 单独一个分支)
minecraft_version=1.19.3
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.19.3]
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=44.1.23
# The loader version range - also used as the required Forge (game loader)
# version in mods.toml.
loader_version_range=[44,)

# Mod Properties
mod_id=damageengine
mod_name=Damage Engine
mod_license=MIT
mod_version=1.4.7.4
mod_group_id=damage.engine
