# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true

# Use system JDK (Zulu 21)
org.gradle.java.home=C:/Program Files/Zulu/zulu-17

# Environment Properties
# 1.18 尝试构建:工具链降到 1.18.2(仅构建配置,业务代码未改)
# 1.18/1.18.1/1.18.2 全兼容:编译按 1.18.2,声明范围 [1.18,1.19)
minecraft_version=1.18.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.18,1.19)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=1.18.2-40.2.0
# The loader version range - also used as the required Forge (game loader)
# version in mods.toml.
loader_version_range=[40,)

# Mod Properties
mod_id=damageengine
mod_name=Damage Engine
mod_license=MIT
mod_version=1.4.8
mod_group_id=damage.engine

# TACZ (compileOnly, optional runtime dependency) - from CurseForge
# 1.18.2 需要对应的 TaCZ 构建,先停用(否则 1.20.1 的包会污染编译错误清单)
# tacz_file_id=8141310
