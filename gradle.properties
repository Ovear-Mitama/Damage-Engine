# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# 本机 JAVA_HOME 也指向 zulu-25；此行为其他机器编译兜底。
# 注意：该路径为机器相关，若在其他环境构建请删除此行或改成对应 JDK25 路径。
org.gradle.java.home=C:\\Program Files\\Zulu\\zulu-25

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.4-snapshot-1
loader_version=0.19.5
loom_version=1.17.19

# Mod Properties
mod_version=1.4.8
maven_group=damage.engine
archives_base_name=damage-engine

# ModMenu (compile only; 26.4 快照暂无对应版本,沿用 26.3 的 21.0.0 仅作编译期 API,不参与运行时)
modmenu_version=21.0.0

# Fabric API (dev dependency, resolves at runtime via the "fabric-api" depends entry)
fabric_api_version=0.161.1+26.4
