plugins {
	// 26.1+ (26.1.x) 为非混淆 Minecraft 版本：必须使用 net.fabricmc.fabric-loom 而非 fabric-loom-remap。
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// 产物命名:damage-engine-<版本号>-<加载器>-<MC版本号>.jar
// Fabric 与 Quilt 共用同一份产物,故统一标为 Fabric
tasks.named('jar') {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-Fabric-${project.minecraft_version}.jar"

    // 把库内置进产物（Jar-in-Jar）：Anima 还没上传 Modrinth，玩家不需要单独安装。
    // 手工嵌套：jar 里放 META-INF/jars/anima-<版本>.jar，并在 fabric.mod.json 的 "jars" 里声明。
    def animaProdJar = file('../texture-animation-library/build/libs/anima-1.0.4.jar')
    if (!animaProdJar.exists()) {
        throw new GradleException("Anima 正式 jar 不存在: ${animaProdJar}\n请先在 texture-animation-library 执行 ./gradlew build")
    }
    from(animaProdJar) {
        into 'META-INF/jars'
    }
}

repositories {
    mavenLocal()
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://mirrors.cloud.tencent.com/nexus/repository/maven-public/" }
    maven { url "https://maven.aliyun.com/repository/public" }
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/damage-engine.accesswidener")

    mods {
        "damage-engine" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

}

// Include common shared sources
sourceSets {
    main {
        java {
            srcDir 'common/src/main/java'
        }
    }
    client {
        java {
            srcDir 'common/src/client/java'
        }
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1+ 为非混淆版本，mod 依赖使用普通 Gradle 配置（implementation 等）
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API (required for networking)
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ModMenu (optional, for config screen integration)
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    runtimeOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // Anima: 跳字（伤害数字）动画 / 渲染库,必需依赖。
    // 本地产物来自同级仓库 texture-animation-library,先在那里执行 ./gradlew build。
    // 26.1+ 为非混淆版本,库产物可直接作为普通依赖使用;发布产物通过上面的 jar 任务内置（Jar-in-Jar）。
    def animaJar = file('../texture-animation-library/build/libs/anima-1.0.4.jar')
    if (!animaJar.exists()) {
        throw new GradleException("Anima jar 不存在: ${animaJar}\n请先在 texture-animation-library 执行 ./gradlew build")
    }
    implementation files(animaJar)

}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from(sourceSets.client.output)

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
