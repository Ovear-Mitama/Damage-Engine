pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

if (JavaVersion.current() < JavaVersion.VERSION_21) {
	throw new GradleException("Damage-Engine 1.21.11 requires Java 21+. Current JVM: ${JavaVersion.current()}. Configure JAVA_HOME to a JDK 21 and re-run ./gradlew.")
}

// Should match your modid
rootProject.name = 'damage-engine'
