plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[5.1,5.2)'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 产物命名:damage-engine-<版本号>-<加载器>-<MC版本号>.jar
tasks.named('jar') {
    archiveFileName = "damage-engine-${mod_version}-Forge-${minecraft_version}.jar"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Include common shared sources
sourceSets {
    main {
        java {
            srcDir '../common/src/main/java'
            srcDir '../common/src/client/java'
        }
    }
}

minecraft {
    mappings channel: 'official', version: '1.18.2'

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            jvmArg '-Xmx2G'

            // Dev runtime is mapped_official (mojmap). Third-party mod jars (e.g.
            // TaCZ) ship mixins with mojmap method names + a refmap that maps them
            // to SRG for the *release* runtime; in dev the refmap wrongly remaps
            // them to SRG and the injection fails. Disabling the refmap lets the
            // mojmap names in the mixin annotations match the dev runtime directly.
            // refMap left at default (no TaCZ at runtime).

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

repositories {
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    // TaCZ 1.18.2 (Forge 版): 编译期依赖,玩家没装 TaCZ 也不影响运行(运行时用 Class.forName 探测)。
    compileOnly fg.deobf("maven.modrinth:${tacz_modrinth_project}:${tacz_modrinth_version}")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
