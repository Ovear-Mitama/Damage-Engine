# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# FG 5.1 首次要为 MC 1.18.2 做反编译,2G 容易 OOM,这里放宽到 4G
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true

# Use system JDK (Zulu 21)
org.gradle.java.home=C:/Program Files/Zulu/zulu-17

# Environment Properties
# 本分支目标 1.18 / 1.18.1(编译基线用 1.18.2,兼容性 API 已在代码层处理:
# slf4j logger 替代 LogUtils、世界渲染事件双路径探测;实测 1.18.0+Forge 38 可启动)
minecraft_version=1.18.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.18,1.19)
# The Forge version must agree with the Minecraft version to get a valid artifact
# build.gradle 拼成 ${minecraft_version}-${forge_version},所以这里只写 Forge 自身版本号
forge_version=40.2.0
# The loader version range - also used as the required Forge (game loader)
# version in mods.toml.
# Forge 38.x = 1.18/1.18.1,39.x = 1.18.1,40.x = 1.18.2;覆盖整个 1.18.x 需从 38 起
loader_version_range=[38,)

# Mod Properties
mod_id=damageengine
mod_name=Damage Engine
mod_license=MIT
mod_version=1.4.8
mod_group_id=damage.engine

# TACZ (compileOnly, optional runtime dependency) - 1.18.2 Forge 版,来自 Modrinth
# 文件: tacz-1.18.2-1.1.4-hotfix-all.jar (https://modrinth.com/mod/timeless-and-classics-zero/version/1.1.4-hotfix)
tacz_modrinth_project=SzzJttH8
tacz_modrinth_version=XELsjBdz
