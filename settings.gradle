pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

if (JavaVersion.current() < JavaVersion.VERSION_17) {
	throw new GradleException("Damage-Engine 1.20.1 requires Java 17+. Current JVM: ${JavaVersion.current()}. Configure JAVA_HOME to a JDK 17 and re-run ./gradlew.")
}
